<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><title>公園の固定コース検証</title></head><body><main id="game" class="game" data-state="running" data-walk-level="2"><canvas id="scene"></canvas></main><script type="module">
import {Game} from '../../src/game.js';
import {Renderer} from '../../src/render.js';
const renderer=new Renderer(document.getElementById('scene'),{useSprites:true});
let game;
function setFixture(timeMs=12000,seed=42,reduced=false){
 renderer.reset();renderer.setReducedMotion(reduced);
 game=new Game({phase:4,walkLevel:2,seed,onEvent:event=>{if(event.type==='collect')renderer.collect(event);if(event.type==='obstacle_contact')renderer.contact(event);if(event.type==='obstacle_pass'&&event.obstacleType==='crow')renderer.depart(event);}});
 game.start();
 for(const input of game.courseData.safeInputs){if(input.timeMs>timeMs)break;game.advance(input.timeMs-game.timeMs);game.command(input.direction,'fixture');}
 game.advance(timeMs-game.timeMs);game.pause('fixture');renderer.draw(game);
 window.__parkPreview.game=game;return game.result();
}
window.__parkPreview={renderer,game:null,setFixture,ready:null};
try{await renderer.ready;setFixture(Number(new URLSearchParams(location.search).get('timeMs')??12000),Number(new URLSearchParams(location.search).get('seed')??42));await renderer.parkLevel2Scene?.ready;renderer.draw(game);window.__parkPreview.ready={ok:true};}catch(error){window.__parkPreview.ready={ok:false,error:error.message};}
</script></body></html>
