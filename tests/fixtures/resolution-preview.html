<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><title>高精細描画の検証</title></head><body><main id="game" class="game" data-state="running"><canvas id="scene"></canvas></main><script type="module">
import {Game} from '../../src/game.js';
import {Renderer} from '../../src/render.js';
const params=new URLSearchParams(location.search),level=Number(params.get('level')??4);
document.querySelector('#game').dataset.walkLevel=String(level);
const renderer=new Renderer(document.querySelector('#scene'),{useSprites:true});
function setFixture(timeMs=12000,reduced=false){
 renderer.reset();renderer.setReducedMotion(reduced);
 const game=new Game({phase:4,walkLevel:level,seed:42});game.start();
 for(const input of game.courseData?.safeInputs??[]){if(input.timeMs>timeMs)break;game.advance(input.timeMs-game.timeMs);game.command(input.direction,'fixture');}
 game.advance(timeMs-game.timeMs);game.pause('fixture');renderer.draw(game,{force:true});
 window.__resolution.game=game;return game.result();
}
window.__resolution={renderer,game:null,setFixture,ready:null};
try{await renderer.ready;await renderer.adventure?.ready;await renderer.prepareWalk(level);setFixture();window.__resolution.ready={ok:true};}catch(error){window.__resolution.ready={ok:false,error:error.stack};}
</script></body></html>
